[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openagentx"
version = "0.1.0"
description = "Pure-stdlib event-sourced agent framework: append-only journals, redaction by default, honest offline grading"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["openagentx"]
